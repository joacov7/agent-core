name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Postgres real para los tests de integración del adapter WISP (apps/wisp): prueban las
    # consultas SQL y el rol de solo lectura contra el esquema de guaynet.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Test
        run: npm test
        env:
          WISP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
